$kind: http-request
name: Create Profil
method: POST
url: '{{base_url}}/profil'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "tipe_profil": "merchant",
      "alamat": "Jl. Contoh No. 1",
      "nama_usaha": "Warung Hemat",
      "deskripsi": "Warung makanan sehat dan hemat",
      "link_map": "https://maps.google.com/?q=-6.2,106.8"
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is successful (2xx)", function () {
            pm.expect(pm.response.code).to.be.within(200, 299);
        });
        pm.test("Response time is acceptable", function () {
            pm.expect(pm.response.responseTime).to.be.below(5000);
        });
        pm.test("Content-Type is application/json", function () {
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });
        pm.test("Response body is valid JSON", function () {
            pm.response.to.be.json;
        });
        pm.test("Response contains created profil data", function () {
            if (pm.response.code === 200 || pm.response.code === 201) {
                const json = pm.response.json();
                pm.expect(json).to.be.an("object");
                const data = json.data || json;
                pm.expect(data).to.have.property("id").or.have.property("user_id");
            }
        });
