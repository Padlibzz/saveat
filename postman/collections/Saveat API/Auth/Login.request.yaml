$kind: http-request
name: Login
method: POST
url: '{{base_url}}/login'
order: 1000
auth:
  type: noauth
headers:
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "login_identifier": "merchant@saveat.com",
      "password": "password123"
    }
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        if (pm.response.code === 200) {
            const json = pm.response.json();
            const token = json.access_token || json.token || (json.data && json.data.access_token);
            if (token) {
                pm.environment.set("access_token", token);
                console.log("access_token saved to environment.");
            } else {
                console.warn("Login succeeded but no token found in response.");
            }
        } else {
            console.error("Login failed with status: " + pm.response.code);
        }
        pm.test("Status code is successful (2xx)", function () {
            pm.expect(pm.response.code).to.be.within(200, 299);
        });
        pm.test("Response time is acceptable", function () {
            pm.expect(pm.response.responseTime).to.be.below(5000);
        });
        pm.test("Content-Type is application/json", function () {
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });
        pm.test("Response body is valid JSON", function () {
            pm.response.to.be.json;
        });
        pm.test("Response contains access_token", function () {
            if (pm.response.code === 200) {
                const json = pm.response.json();
                const token = json.access_token || json.token || (json.data && json.data.access_token);
                pm.expect(token).to.be.a("string").and.not.empty;
            }
        });
