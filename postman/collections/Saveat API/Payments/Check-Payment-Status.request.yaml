$kind: http-request
name: Check Payment Status
method: GET
url: '{{base_url}}/payments/{{claim_id}}/status'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();
      pm.test("Status 200 - Berhasil cek status", () => {
          pm.response.to.have.status(200);
      });
      pm.test("Response memiliki data pembayaran", () => {
          pm.expect(res.data).to.have.property('status_pembayaran');
          pm.expect(res.data).to.have.property('midtrans_transaction_status');
      });
