$kind: http-request
name: Create Listing
method: POST
url: '{{base_url}}/merchant/listings'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Accept
    value: application/json
body:
  type: formdata
  content:
    - key: kategori_id
      type: text
      value: '1'
    - key: nama
      type: text
      value: 'Nasi Box Hemat'
    - key: harga_normal
      type: text
      value: '25000'
    - key: harga_diskon
      type: text
      value: '15000'
    - key: stok_total
      type: text
      value: '10'
    - key: batas_waktu
      type: text
      value: '2026-12-31 20:00:00'
    - key: foto
      type: file
      src: ''
      disabled: true
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        if (pm.response.code === 200 || pm.response.code === 201) {
            const json = pm.response.json();
            const id = (json.data && (json.data.id || json.data.listing_id)) || json.id || json.listing_id;
            if (id) {
                pm.environment.set("listing_id", id);
                console.log("listing_id saved to environment: " + id);
            } else {
                console.warn("Create Listing succeeded but no listing_id found in response.");
            }
        } else {
            console.error("Create Listing failed with status: " + pm.response.code);
        }
        pm.test("Status code is successful (2xx)", function () {
            pm.expect(pm.response.code).to.be.within(200, 299);
        });
        pm.test("Response time is acceptable", function () {
            pm.expect(pm.response.responseTime).to.be.below(5000);
        });
        pm.test("Content-Type is application/json", function () {
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });
        pm.test("Response body is valid JSON", function () {
            pm.response.to.be.json;
        });
        pm.test("Response contains listing data with id", function () {
            if (pm.response.code === 200 || pm.response.code === 201) {
                const json = pm.response.json();
                const id = (json.data && (json.data.id || json.data.listing_id)) || json.id || json.listing_id;
                pm.expect(id).to.exist;
            }
        });
