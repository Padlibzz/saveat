$kind: http-request
name: Get Users
method: GET
url: '{{base_url}}/admin/users'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{access_token}}'
headers:
  - key: Accept
    value: application/json
queryParams:
  - key: peran
    value: ''
  - key: status
    value: ''
  - key: search
    value: ''
events:
  - listen: test
    script:
      type: text/javascript
      exec: |-
        pm.test("Status code is successful (2xx)", function () {
            pm.expect(pm.response.code).to.be.within(200, 299);
        });
        pm.test("Response time is acceptable", function () {
            pm.expect(pm.response.responseTime).to.be.below(5000);
        });
        pm.test("Content-Type is application/json", function () {
            pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
        });
        pm.test("Response body is valid JSON", function () {
            pm.response.to.be.json;
        });
        pm.test("Response contains users list", function () {
            if (pm.response.code === 200) {
                const json = pm.response.json();
                pm.expect(json).to.be.an("object");
            }
        });
  - listen: visualizer
    script:
      type: text/javascript
      exec: |-
        const res = pm.response.json();
        const users = res.data.data;

        // Count by role
        const roleCounts = {};
        users.forEach(u => {
            roleCounts[u.peran] = (roleCounts[u.peran] || 0) + 1;
        });

        const labels = Object.keys(roleCounts);
        const counts = Object.values(roleCounts);

        const template = `
        <html>
        <head>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
        </head>
        <body style="background:#fff;padding:20px;">
          <h3 style="font-family:sans-serif;text-align:center;">Users by Role</h3>
          <canvas id="chart" width="400" height="250"></canvas>
          <script>
            const ctx = document.getElementById('chart').getContext('2d');
            new Chart(ctx, {
              type: 'bar',
              data: {
                labels: {{labels}},
                datasets: [{
                  label: 'Number of Users',
                  data: {{counts}},
                  backgroundColor: ['#4e79a7','#f28e2b','#e15759','#76b7b2','#59a14f'],
                  borderRadius: 6
                }]
              },
              options: {
                responsive: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
              }
            });
          <\/script>
        </body>
        </html>
        `;

        pm.visualizer.set(template, {
            labels: JSON.stringify(labels),
            counts: JSON.stringify(counts)
        });